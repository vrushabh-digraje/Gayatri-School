    <style>
        html, body {
            overflow-x: clip;
            max-width: 100vw;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            color: #1e3a8a;
            background-color: #f8fafc;
        }
        h1, h2, h3, .font-serif {
            font-family: 'Playfair Display', serif;
        }
        @keyframes marquee {
          0% { transform: translateX(100%); }
          100% { transform: translateX(-100%); }
        }
        .animate-marquee {
          animation: marquee 30s linear infinite;
        }
        .blue-gradient {
          background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        }

        /* Advanced Animation Keyframes */
        @keyframes fadeInUp {
          from { opacity: 0; transform: translateY(30px); }
          to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInRight {
          from { opacity: 0; transform: translateX(-30px); }
          to { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeInLeft {
          from { opacity: 0; transform: translateX(30px); }
          to { opacity: 1; transform: translateX(0); }
        }
        @keyframes scaleIn {
          from { opacity: 0; transform: scale(0.9); }
          to { opacity: 1; transform: scale(1); }
        }
        @keyframes float {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-10px); }
        }

        .animate-fade-in-up { animation: fadeInUp 0.8s ease-out forwards; }
        .animate-fade-in-right { animation: fadeInRight 0.8s ease-out forwards; }
        .animate-fade-in-left { animation: fadeInLeft 0.8s ease-out forwards; }
        .animate-scale-in { animation: scaleIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-float { animation: float 3s ease-in-out infinite; }

        .reveal {
          opacity: 0;
          transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal.active {
          opacity: 1;
        }
        .reveal-up { transform: translateY(40px); }
        .reveal-up.active { transform: translateY(0); }
        
        .stagger-delay-1 { animation-delay: 100ms; }
        .stagger-delay-2 { animation-delay: 200ms; }
        .stagger-delay-3 { animation-delay: 300ms; }
        .stagger-delay-4 { animation-delay: 400ms; }
    </style>
